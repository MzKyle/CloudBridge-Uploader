appId: com.cloudbridge.uploader
productName: 云桥上传器
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!src/**'
  - '!**/test/**'
  - '!**/tests/**'
  - '!**/docs/**'
  - '!**/README*'
  - '!**/*.ts'
  - '!**/*.tsx'
extraResources:
  - from: resources/
    to: resources/
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
linux:
  artifactName: CloudBridge-Uploader-${version}-linux-${arch}.${ext}
  maintainer: MzKyle <MzKyle@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  icon: resources/icon.png
win:
  artifactName: CloudBridge-Uploader-${version}-windows-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
